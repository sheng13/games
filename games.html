<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小游戏大厅</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#f8fafc;background:radial-gradient(circle at 15% 15%,#3730a3,transparent 34%),radial-gradient(circle at 85% 80%,#155e75,transparent 32%),#070b18}.wrap{width:min(920px,100%);text-align:center}h1{font-size:clamp(38px,7vw,68px);margin:0 0 8px}.lead{color:#cbd5e1;font-size:18px;margin-bottom:38px}.games{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}.game{display:flex;flex-direction:column;align-items:center;min-height:330px;padding:34px 26px;color:inherit;text-decoration:none;background:#0f172acc;border:1px solid #ffffff25;border-radius:28px;box-shadow:0 22px 60px #0006;transition:.2s}.game:hover{transform:translateY(-7px);border-color:#67e8f9;box-shadow:0 25px 65px #0891b233}.icon{font-size:76px}.game h2{font-size:29px;margin:17px 0 8px}.game p{color:#aebbd0;line-height:1.7;margin:0;flex:1}.play{display:inline-block;margin-top:25px;padding:12px 28px;border-radius:999px;color:#0f172a;background:linear-gradient(135deg,#6ee7ff,#a78bfa);font-weight:900}@media(max-width:650px){.games{grid-template-columns:1fr}.game{min-height:280px}}
</style></head><body><main class="wrap"><h1>小游戏大厅</h1><p class="lead">选择一个游戏，马上开始挑战！</p><section class="games"><a class="game" href="/guess"><div class="icon">🎯</div><h2>猜数字</h2><p>猜出电脑选择的 1～100 数字，系统会提示太大或太小。</p><span class="play">开始游戏</span></a><a class="game" href="/gomoku"><div class="icon">⚫</div><h2>AI 五子棋</h2><p>在 15 × 15 棋盘与电脑对战，率先连成五子即可获胜。</p><span class="play">开始游戏</span></a><a class="game" href="/tictactoe"><div class="icon">❌</div><h2>井字棋</h2><p>你执 X 与电脑对战，率先在横、直或斜线上连成三个棋子。</p><span class="play">开始游戏</span></a><a class="game" href="/online"><div class="icon">🌐</div><h2>联机双人</h2><p>同一网络的两台电脑使用房间代码，实时对战五子棋或井字棋。</p><span class="play">建立／加入房间</span></a></section></main></body></html>
