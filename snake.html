<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>霓虹贪吃蛇</title>
<style>
:root{--page:#070b18;--panel:#0f172ae8;--text:#f8fafc;--muted:#aebbd0;--line:#ffffff25;--cyan:#67e8f9;--purple:#a78bfa}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px 18px 32px;font-family:system-ui,"Microsoft YaHei",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 15%,#3730a3,transparent 34%),radial-gradient(circle at 85% 80%,#155e75,transparent 32%),var(--page);display:flex;justify-content:center;overscroll-behavior:none}button,select{font:inherit}.page{width:min(980px,100%)}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.back{color:#dbeafe;text-decoration:none;padding:10px 15px;border:1px solid var(--line);border-radius:999px;background:#0f172aa8}.back:hover{border-color:var(--cyan)}h1{font-size:clamp(25px,4vw,38px);margin:0}.subtitle{color:var(--muted);margin:4px 0 0;text-align:right}.shell{display:grid;grid-template-columns:minmax(280px,580px) minmax(230px,1fr);gap:22px;align-items:start}.panel,.side{background:var(--panel);border:1px solid var(--line);border-radius:26px;box-shadow:0 22px 60px #0007}.panel{padding:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px}.stat{padding:9px;text-align:center;background:#ffffff0b;border:1px solid var(--line);border-radius:14px}.stat span{display:block;font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:24px}.stage{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;border:1px solid #67e8f955;background:#050918}canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:#050918bd;backdrop-filter:blur(4px);text-align:center}.overlay[hidden]{display:none}.overlay h2{font-size:32px;margin:0 0 8px}.overlay p{color:#cbd5e1;line-height:1.6;margin:0 0 18px}.primary{border:0;border-radius:999px;padding:12px 26px;color:#07111f;background:linear-gradient(135deg,var(--cyan),var(--purple));font-weight:900;cursor:pointer}.side{padding:22px}.side h2{font-size:19px;margin:0 0 14px}.field{display:grid;gap:7px;margin-bottom:18px}.field label,.tip{color:var(--muted);font-size:14px}.field select{padding:11px;border-radius:12px;border:1px solid var(--line);background:#111c33;color:var(--text)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.secondary{padding:11px;border-radius:12px;border:1px solid var(--line);background:#ffffff0a;color:var(--text);font-weight:700;cursor:pointer}.secondary:disabled{opacity:.45}.tip{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);line-height:1.7}.keys{margin-top:9px}.key{display:inline-block;padding:3px 8px;margin:2px;border:1px solid #ffffff38;border-bottom-width:3px;border-radius:6px}.dpad{display:none;width:194px;margin:18px auto 0;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,54px);gap:7px;justify-content:center}.dir{border:1px solid var(--line);border-radius:15px;background:#ffffff0c;color:var(--text);font-size:25px;touch-action:manipulation}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}.live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}@media(max-width:760px){body{padding:14px 12px}.subtitle{display:none}.shell{grid-template-columns:1fr}.dpad{display:grid}.keys{display:none}.panel{padding:11px}.side{padding:18px}}
</style></head><body><main class="page"><header class="top"><a class="back" href="/">← 游戏大厅</a><div><h1>🐍 霓虹贪吃蛇</h1><p class="subtitle">吃掉能量果实，别撞上墙壁和自己</p></div></header><section class="shell"><div class="panel"><div class="stats"><div class="stat"><span>分数</span><strong id="score">0</strong></div><div class="stat"><span>最高分</span><strong id="best">0</strong></div><div class="stat"><span>长度</span><strong id="length">3</strong></div></div><div class="stage"><canvas id="board" width="600" height="600" aria-label="贪吃蛇游戏区域"></canvas><div class="overlay" id="overlay"><div><h2 id="overlayTitle">准备好了吗？</h2><p id="overlayText">使用方向键、WASD 或下方按钮控制方向。</p><button class="primary" id="startBtn">开始游戏</button></div></div></div><div class="dpad" aria-label="触控方向键"><button class="dir up" data-dir="up">↑</button><button class="dir left" data-dir="left">←</button><button class="dir down" data-dir="down">↓</button><button class="dir right" data-dir="right">→</button></div></div><aside class="side"><h2>游戏设置</h2><div class="field"><label for="speed">移动速度</label><select id="speed"><option value="150">悠闲</option><option value="105" selected>标准</option><option value="70">极速</option></select></div><div class="actions"><button class="secondary" id="pauseBtn" disabled>暂停</button><button class="secondary" id="restartBtn">重新开始</button></div><div class="tip">每吃到一颗果实可得 <strong>10 分</strong>。速度可以随时调整，最高分保存在当前浏览器。<div class="keys"><span class="key">方向键 / WASD</span><span class="key">空格暂停</span></div></div></aside></section><p class="live" id="announcement" aria-live="polite"></p></main>
<script>
const canvas=document.querySelector('#board'),ctx=canvas.getContext('2d'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),lengthEl=document.querySelector('#length'),overlay=document.querySelector('#overlay'),overlayTitle=document.querySelector('#overlayTitle'),overlayText=document.querySelector('#overlayText'),startBtn=document.querySelector('#startBtn'),pauseBtn=document.querySelector('#pauseBtn'),restartBtn=document.querySelector('#restartBtn'),speed=document.querySelector('#speed'),announcement=document.querySelector('#announcement');
const cells=20,cell=30,dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};let snake,direction,queued,food,score,loop,state='ready',best=Number(localStorage.getItem('neonSnakeBest')||0);bestEl.textContent=best;
function reset(){clearInterval(loop);snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];direction=queued=dirs.right;score=0;state='ready';placeFood();stats();pauseBtn.disabled=true;pauseBtn.textContent='暂停';show('准备好了吗？','使用方向键、WASD 或下方按钮控制方向。','开始游戏');draw()}
function start(){if(state==='over')reset();if(state==='ready'){state='playing';overlay.hidden=true;pauseBtn.disabled=false;restartLoop();announcement.textContent='游戏开始'}else if(state==='paused')pause()}
function restartLoop(){clearInterval(loop);if(state==='playing')loop=setInterval(tick,Number(speed.value))}
function tick(){if(state!=='playing')return;direction=queued;const head={x:snake[0].x+direction.x,y:snake[0].y+direction.y},eat=head.x===food.x&&head.y===food.y,body=eat?snake:snake.slice(0,-1);if(head.x<0||head.x>=cells||head.y<0||head.y>=cells||body.some(p=>p.x===head.x&&p.y===head.y))return over();snake.unshift(head);if(eat){score+=10;if(score>best){best=score;localStorage.setItem('neonSnakeBest',best)}if(!placeFood()){stats();return over(true)}stats();announcement.textContent=`得分 ${score}`}else snake.pop();draw()}
function setDir(name){const d=dirs[name];if(!d||d.x+direction.x===0&&d.y+direction.y===0)return;queued=d;if(state==='ready')start()}
function placeFood(){const occupied=new Set((snake||[]).map(p=>p.y*cells+p.x)),available=[];for(let y=0;y<cells;y++)for(let x=0;x<cells;x++)if(!occupied.has(y*cells+x))available.push({x,y});if(!available.length){food=null;return false}food=available[Math.floor(Math.random()*available.length)];return true}
function pause(){if(state==='playing'){state='paused';clearInterval(loop);pauseBtn.textContent='继续';show('游戏暂停','休息一下，准备好后继续挑战。','继续游戏')}else if(state==='paused'){state='playing';overlay.hidden=true;pauseBtn.textContent='暂停';restartLoop()}}
function over(won=false){state='over';clearInterval(loop);pauseBtn.disabled=true;show(won?'挑战成功':'挑战结束',`本局获得 ${score} 分，蛇身长度 ${snake.length}。`,'再玩一局');announcement.textContent=`${won?'游戏完成':'游戏结束'}，得分 ${score}`;draw(!won)}
function show(title,text,button){overlayTitle.textContent=title;overlayText.textContent=text;startBtn.textContent=button;overlay.hidden=false}function stats(){scoreEl.textContent=score;bestEl.textContent=best;lengthEl.textContent=snake.length}
function draw(crashed=false){ctx.fillStyle='#07101f';ctx.fillRect(0,0,600,600);ctx.strokeStyle='#67e8f90e';for(let i=1;i<cells;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,600);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(600,i*cell);ctx.stroke()}if(food){const fx=food.x*cell+15,fy=food.y*cell+15;ctx.shadowColor='#fb7185';ctx.shadowBlur=22;ctx.fillStyle='#fb7185';ctx.beginPath();ctx.arc(fx,fy,10,0,Math.PI*2);ctx.fill()}snake.forEach((p,i)=>{ctx.shadowColor=i?'#8b5cf6':'#67e8f9';ctx.shadowBlur=i<5?12:2;ctx.fillStyle=crashed&&i===0?'#fb7185':i===0?'#34d399':'#7dd3fc';ctx.beginPath();ctx.roundRect(p.x*cell+3,p.y*cell+3,24,24,i===0?9:7);ctx.fill();if(i===0)eyes(p)});ctx.shadowBlur=0}
function eyes(h){const x=h.x*cell+15,y=h.y*cell+15;let ps=direction.x?[{x:x+direction.x*7,y:y-5},{x:x+direction.x*7,y:y+5}]:[{x:x-5,y:y+direction.y*7},{x:x+5,y:y+direction.y*7}];ctx.fillStyle='#07111f';ctx.shadowBlur=0;ps.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);ctx.fill()})}
document.addEventListener('keydown',e=>{const m={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};if(m[e.key]){e.preventDefault();setDir(m[e.key])}if(e.code==='Space'){e.preventDefault();if(!pauseBtn.disabled)pause()}});document.querySelectorAll('.dir').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();setDir(b.dataset.dir)}));canvas.addEventListener('pointerdown',e=>canvas.swipe={x:e.clientX,y:e.clientY});canvas.addEventListener('pointerup',e=>{if(!canvas.swipe)return;let dx=e.clientX-canvas.swipe.x,dy=e.clientY-canvas.swipe.y;if(Math.max(Math.abs(dx),Math.abs(dy))>24)setDir(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up');canvas.swipe=null});startBtn.onclick=start;pauseBtn.onclick=pause;restartBtn.onclick=reset;speed.onchange=restartLoop;document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});reset();
</script></body></html>
