<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>猜数字挑战</title>
<style>:root{color-scheme:dark;--b:#6ee7ff;--p:#a78bfa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#f8fafc;background:radial-gradient(circle at 20% 10%,#312e81 0,transparent 35%),radial-gradient(circle at 85% 80%,#164e63 0,transparent 34%),#070b18}.card{width:min(100%,520px);padding:clamp(24px,6vw,48px);text-align:center;background:#0f172ac7;border:1px solid #ffffff24;border-radius:28px;box-shadow:0 24px 70px #0007}.icon{font-size:54px}h1{margin:8px;font-size:clamp(32px,8vw,52px)}.intro{color:#cbd5e1;line-height:1.7;margin-bottom:26px}.range{color:var(--b);font-weight:800}.settings{margin:14px 0}.settings select{padding:9px 14px;border-radius:10px;background:#172554;color:#fff;border:1px solid #ffffff33}form{display:flex;gap:10px}input{min-width:0;flex:1;padding:16px;color:#fff;background:#0f172a;border:2px solid #334155;border-radius:14px;font-size:22px;text-align:center;outline:none}input:focus{border-color:var(--b)}button{border:0;border-radius:14px;padding:0 22px;min-height:48px;color:#0f172a;background:linear-gradient(135deg,var(--b),var(--p));font-weight:800;font-size:16px;cursor:pointer}button:disabled{opacity:.45}#message{min-height:62px;display:grid;place-items:center;margin:22px 0 14px;padding:12px;border-radius:14px;background:#ffffff0b;font-size:18px;font-weight:700}.correct{color:#86efac}.wrong{color:#fde68a}.error{color:#fda4af}.stats{display:flex;justify-content:center;gap:34px;color:#94a3b8}.stats strong{display:block;color:#fff;font-size:25px}#restart{margin-top:24px}.other{display:inline-block;margin-top:22px;color:#94a3b8;font-size:14px}@media(max-width:440px){form{flex-direction:column}}</style></head>
<body><main class="card"><div class="icon">🎯</div><h1>猜数字挑战</h1><p class="intro">电脑已经选好了一个 <span class="range" id="range">1 到 100</span> 的数字。<br>选择难度，看看能多快猜中！</p><div class="settings"><label>难度 <select id="difficulty"><option value="easy">简单（1～50／12次）</option><option value="normal" selected>普通（1～100／10次）</option><option value="hard">困难（1～500／9次）</option></select></label></div><form id="form"><input id="guess" type="number" min="1" max="100" step="1" placeholder="输入数字" required autofocus><button id="submit">提交答案</button></form><div id="message" role="status">准备好了吗？</div><div class="stats"><div><strong id="attempts">0</strong>已猜次数</div><div><strong id="remaining">10</strong>剩余机会</div></div><button id="restart">重新开始</button><br><a class="other" href="/">← 返回游戏大厅</a></main>
<script>const f=document.querySelector('#form'),i=document.querySelector('#guess'),s=document.querySelector('#submit'),m=document.querySelector('#message');function show(d,c=''){m.textContent=d.message||d.error;m.className=c;if(d.attempts!==undefined)attempts.textContent=d.attempts;if(d.remaining!==undefined)remaining.textContent=d.remaining}async function fresh(){let r=await fetch('/api/new-game',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({difficulty:document.querySelector('#difficulty').value})}),d=await r.json();show(d);i.disabled=s.disabled=false;i.max=d.maximum;document.querySelector("#range").textContent=`1 到 `;i.value='';i.focus()}f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/guess',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({guess:Number(i.value)})}),d=await r.json(),done=d.result==='correct'||d.result==='lost';show(d,r.ok?(d.result==='correct'?'correct':'wrong'):'error');i.disabled=s.disabled=done;if(!done){i.select();i.focus()}};restart.onclick=fresh;document.querySelector('#difficulty').onchange=fresh;fresh().catch(()=>show({error:'无法连接服务器。'},'error'))</script></body></html>
