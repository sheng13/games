<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>局域网联机双人</title>
<style>
:root{color-scheme:dark;--cyan:#67e8f9;--purple:#a78bfa;--panel:rgba(15,23,42,.86)}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#f8fafc;background:radial-gradient(circle at 10% 5%,#4f46e555,transparent 30%),radial-gradient(circle at 90% 90%,#0891b255,transparent 32%),#060914}.back{display:inline-flex;padding:10px 17px;color:#dbeafe;background:#ffffff0d;border:1px solid #ffffff1f;border-radius:999px;text-decoration:none;font-weight:750;transition:.18s}.back:hover{background:#ffffff1a;transform:translateX(-2px)}.card{width:min(920px,100%);margin:26px auto;padding:clamp(22px,5vw,48px);text-align:center;background:var(--panel);border:1px solid #ffffff24;border-radius:32px;box-shadow:0 28px 80px #0008;backdrop-filter:blur(16px)}h1{font-size:clamp(32px,7vw,54px);letter-spacing:-1.5px;margin:0 0 8px}.muted{color:#aebbd0;line-height:1.7}.setup{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:30px}.panel{padding:26px;background:linear-gradient(145deg,#ffffff0d,#ffffff06);border:1px solid #ffffff20;border-radius:22px;box-shadow:inset 0 1px #ffffff10}.panel h2{margin:0 0 15px;font-size:23px}select,input,button{min-height:48px;padding:10px 15px;border-radius:13px;font:inherit}select,input{width:100%;margin:8px 0;color:#fff;background:#111c3d;border:1px solid #ffffff30;outline:none}select:focus,input:focus{border-color:var(--cyan);box-shadow:0 0 0 4px #22d3ee1f}button{border:0;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#0f172a;font-weight:900;cursor:pointer;transition:.18s}button:hover{transform:translateY(-2px);filter:brightness(1.08)}.panel button{width:100%;margin-top:8px}.room-line{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:14px 0}.room-code{padding:8px 18px;font-size:clamp(28px,7vw,42px);letter-spacing:8px;color:var(--cyan);background:#02061780;border:1px solid #67e8f944;border-radius:16px;font-weight:950}.copy-btn{min-height:40px;padding:7px 14px;font-size:14px}.info{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.info span{padding:9px 16px;border:1px solid #ffffff1a;border-radius:999px;background:#ffffff0d}.error{color:#fda4af;min-height:25px}#lobby-error{color:#86efac}#game{display:none}.board{display:grid;margin:24px auto;touch-action:manipulation}.gomoku{--cell:clamp(19px,5.25vw,30px);grid-template-columns:repeat(15,var(--cell));grid-template-rows:repeat(15,var(--cell));width:max-content;padding:14px;background:linear-gradient(145deg,#edc886,#c9954e);border:3px solid #7c5526;border-radius:8px;box-shadow:0 16px 35px #0007,inset 0 0 20px #fff3}.gomoku .cell{appearance:none;position:relative;width:var(--cell)!important;height:var(--cell)!important;min-width:0!important;min-height:0!important;max-width:var(--cell)!important;max-height:var(--cell)!important;padding:0!important;border:0;border-radius:0;background:transparent;box-shadow:none}.gomoku .cell::before,.gomoku .cell::after{content:'';position:absolute;background:#65451f;z-index:0;pointer-events:none}.gomoku .cell::before{left:0;right:0;top:50%;height:1px}.gomoku .cell::after{top:0;bottom:0;left:50%;width:1px}.board .cell:hover{transform:none;filter:none}.piece{position:absolute;z-index:2;display:block;left:50%;top:50%;width:84%;height:84%;transform:translate(-50%,-50%);border-radius:50%;box-shadow:1px 2px 5px #0007}.piece.x{background:radial-gradient(circle at 35% 28%,#606060,#050505 68%);border:1px solid #000}.piece.o{background:radial-gradient(circle at 35% 28%,#fff,#d8d8d8 72%);border:1px solid #777}.tictactoe{grid-template-columns:repeat(3,clamp(76px,24vw,112px));gap:10px;width:max-content;background:transparent}.tictactoe .cell{width:clamp(76px,24vw,112px);height:clamp(76px,24vw,112px);padding:0;border:2px solid #ffffff20;border-radius:18px;background:#172554;color:#fff;font-size:clamp(48px,17vw,72px);font-weight:950}.tictactoe .cell.x{color:var(--cyan)}.tictactoe .cell.o{color:#c4b5fd}.tictactoe .cell.selected{outline:4px solid #facc15;transform:scale(.94)}.chess{grid-template-columns:repeat(8,clamp(38px,9vw,70px));width:max-content;border:2px solid #94a3b8;border-radius:9px;overflow:hidden;box-shadow:0 16px 35px #0008}.chess .cell{appearance:none;position:relative;width:clamp(38px,9vw,70px);height:clamp(38px,9vw,70px);min-width:0;min-height:0;padding:0;border:0;border-radius:0;display:grid;place-items:center;font-family:"DejaVu Sans",serif;font-size:clamp(28px,7vw,58px);line-height:1}.chess .cell.light{background:#dbeafe}.chess .cell.dark{background:#52647c}.chess .cell.chess-selected{box-shadow:inset 0 0 0 5px var(--cyan);background:#0e7490}.chess .cell.in-check{box-shadow:inset 0 0 0 999px #fb718566}.chess-piece.white{color:#fff;text-shadow:0 2px 2px #000,0 0 1px #000}.chess-piece.black{color:#111827;text-shadow:0 1px 1px #fff8}.move-hint{position:absolute;width:22%;height:22%;border-radius:50%;background:#0f172a99}.move-hint.capture{width:76%;height:76%;background:transparent;border:5px solid #fb7185aa}.promotion-wrap{display:none;margin-top:12px;color:#aebbd0}.promotion-wrap select{width:auto;min-height:40px;margin-left:6px;padding:5px 10px}
#restart{margin-top:6px;padding-inline:28px}@media(max-width:650px){body{padding:14px}.card{margin:16px auto;padding:22px 12px;border-radius:24px}.setup{grid-template-columns:1fr}.gomoku{padding:9px}.room-code{letter-spacing:5px}.back{font-size:14px}}@media(max-width:390px){.gomoku{--cell:18px}.tictactoe{grid-template-columns:repeat(3,78px)}.tictactoe .cell{width:78px;height:78px}}
</style></head>
<body><a class="back" href="/">← 返回游戏大厅</a><main class="card"><section id="lobby"><h1>局域网联机双人</h1><p class="muted">一台电脑建立房间，另一台电脑输入 6 位房间代码。</p><div class="setup"><div class="panel"><h2>建立房间</h2><select id="game-type"><option value="gomoku">五子棋</option><option value="tictactoe">三子移动井字棋</option><option value="chess">西洋棋</option></select><button id="create">建立新房间</button></div><div class="panel"><h2>加入房间</h2><input id="join-code" maxlength="6" inputmode="numeric" placeholder="输入 6 位代码"><button id="join">加入房间</button></div></div><p id="lobby-error" class="error"></p></section>
<section id="game"><h1 id="game-title">联机游戏</h1><div class="room-line"><span>房间代码</span><span class="room-code" id="room-code"></span><button class="copy-btn" id="copy-code" type="button">复制代码</button></div><div class="info"><span>你是：<strong id="my-mark"></strong></span><span id="status">等待玩家</span></div><label class="promotion-wrap" id="promotion-wrap">兵升变为<select id="promotion-choice"><option value="Q">后</option><option value="R">车</option><option value="B">象</option><option value="N">马</option></select></label><div id="board" class="board"></div><p id="game-error" class="error"></p><button id="restart">重新开始</button></section></main>
<script src="/static/socket.io.min.js"></script><script>
const socket=io({transports:['polling'],upgrade:false}),lobby=document.querySelector('#lobby'),game=document.querySelector('#game'),boardEl=document.querySelector('#board'),statusEl=document.querySelector('#status'),createBtn=document.querySelector('#create'),joinBtn=document.querySelector('#join'),restartBtn=document.querySelector('#restart'),copyBtn=document.querySelector('#copy-code');
const chessIcons={w:{K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙'},b:{K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'}};let me=null,state=null,selected=null,legalMoves=[];
createBtn.addEventListener('click',()=>socket.emit('create_room',{game:document.querySelector('#game-type').value}));joinBtn.addEventListener('click',()=>socket.emit('join_game',{code:document.querySelector('#join-code').value}));restartBtn.addEventListener('click',()=>socket.emit('restart_online'));copyBtn.addEventListener('click',async()=>{await navigator.clipboard?.writeText(document.querySelector('#room-code').textContent);copyBtn.textContent='已复制';setTimeout(()=>copyBtn.textContent='复制代码',1200)});
socket.on('connect',()=>{document.querySelector('#lobby-error').textContent='实时服务器已连接。'});socket.on('connect_error',()=>{document.querySelector('#lobby-error').textContent='无法连接实时游戏服务器，请重新启动服务器后刷新页面。'});
socket.on('room_joined',data=>{me=data.player;state=data;selected=null;legalMoves=[];lobby.style.display='none';game.style.display='block';document.querySelector('#room-code').textContent=data.code;const labels={gomoku:me==='X'?'黑棋':'白棋',tictactoe:me,chess:me==='X'?'白方':'黑方'},titles={gomoku:'联机五子棋',tictactoe:'联机三子移动井字棋',chess:'联机西洋棋'};document.querySelector('#my-mark').textContent=labels[data.game];document.querySelector('#game-title').textContent=titles[data.game];document.querySelector('#promotion-wrap').style.display=data.game==='chess'?'block':'none';render()});
socket.on('state',data=>{state=data;selected=null;legalMoves=[];render()});socket.on('chess_moves',data=>{selected={row:data.row,col:data.col};legalMoves=data.moves;render()});socket.on('game_error',d=>{(game.style.display==='block'?document.querySelector('#game-error'):document.querySelector('#lobby-error')).textContent=d.message});socket.on('opponent_left',d=>{statusEl.textContent=d.message});
function render(){if(!state)return;boardEl.innerHTML='';boardEl.className='board '+state.game;if(state.game==='gomoku'){for(let r=0;r<15;r++)for(let c=0;c<15;c++)addCell(state.board[r][c],()=>moveGomoku(r,c))}else if(state.game==='tictactoe')state.board.forEach((v,i)=>addCell(v,()=>moveTtt(i),i));else renderChess();renderStatus()}
function renderStatus(){if(state.winner==='draw')statusEl.textContent='本局和棋';else if(state.winner)statusEl.textContent=state.winner===me?'🎉 你赢了！':'对方获胜';else if(!state.started)statusEl.textContent='等待另一位玩家加入…';else{let text=state.turn===me?'轮到你了':'等待对方落子…';if(state.game==='chess'&&state.check)text+='（将军）';statusEl.textContent=text}}
function addCell(value,click,index){const b=document.createElement('button');b.className='cell '+(state.game==='tictactoe'&&value?value.toLowerCase():'')+(index===selected?' selected':'');b.setAttribute('aria-label',value||'空位');if(state.game==='tictactoe')b.textContent=value;else if(value){const piece=document.createElement('span');piece.className='piece '+value.toLowerCase();b.appendChild(piece)}b.onclick=click;boardEl.appendChild(b)}
function renderChess(){const rows=me==='O'?[7,6,5,4,3,2,1,0]:[0,1,2,3,4,5,6,7],cols=me==='O'?[7,6,5,4,3,2,1,0]:[0,1,2,3,4,5,6,7];for(const r of rows)for(const c of cols){const value=state.board[r][c],b=document.createElement('button'),hint=legalMoves.find(m=>m.row===r&&m.col===c);b.className=`cell ${(r+c)%2?'dark':'light'}`;if(selected?.row===r&&selected.col===c)b.classList.add('chess-selected');if(state.check&&value&&value[1]==='K'&&((state.turn==='X'&&value[0]==='w')||(state.turn==='O'&&value[0]==='b')))b.classList.add('in-check');b.setAttribute('aria-label',value?`${value[0]==='w'?'白':'黑'}${value[1]} ${String.fromCharCode(97+c)}${8-r}`:`${String.fromCharCode(97+c)}${8-r}`);if(value){const piece=document.createElement('span');piece.className='chess-piece '+(value[0]==='w'?'white':'black');piece.textContent=chessIcons[value[0]][value[1]];b.appendChild(piece)}if(hint){const dot=document.createElement('span');dot.className='move-hint'+(value?' capture':'');b.appendChild(dot)}b.onclick=()=>moveChess(r,c);boardEl.appendChild(b)}}
function moveGomoku(row,col){if(state.started&&state.turn===me&&!state.winner)socket.emit('make_move',{row,col})}
function moveTtt(i){if(!state.started||state.turn!==me||state.winner)return;if(state.placed[me]<3){socket.emit('make_move',{to:i,from:null});return}if(selected===null){if(state.board[i]!==me){document.querySelector('#game-error').textContent='请先选择自己的一颗棋。';return}selected=i;render();return}if(state.board[i]===me){selected=i;render();return}socket.emit('make_move',{from:selected,to:i})}
function moveChess(row,col){if(!state.started||state.turn!==me||state.winner)return;const value=state.board[row][col],myColor=me==='X'?'w':'b',target=legalMoves.find(m=>m.row===row&&m.col===col);if(selected&&target){socket.emit('make_move',{from_row:selected.row,from_col:selected.col,to_row:row,to_col:col,promotion:document.querySelector('#promotion-choice').value});return}if(value&&value[0]===myColor){document.querySelector('#game-error').textContent='';socket.emit('get_chess_moves',{row,col})}else{selected=null;legalMoves=[];render()}}
</script></body></html>
