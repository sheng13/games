<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>局域网联机双人</title>
<style>
:root{color-scheme:dark;--cyan:#67e8f9;--purple:#a78bfa;--panel:rgba(15,23,42,.86)}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#f8fafc;background:radial-gradient(circle at 10% 5%,#4f46e555,transparent 30%),radial-gradient(circle at 90% 90%,#0891b255,transparent 32%),#060914}.back{display:inline-flex;padding:10px 17px;color:#dbeafe;background:#ffffff0d;border:1px solid #ffffff1f;border-radius:999px;text-decoration:none;font-weight:750;transition:.18s}.back:hover{background:#ffffff1a;transform:translateX(-2px)}.card{width:min(920px,100%);margin:26px auto;padding:clamp(22px,5vw,48px);text-align:center;background:var(--panel);border:1px solid #ffffff24;border-radius:32px;box-shadow:0 28px 80px #0008;backdrop-filter:blur(16px)}h1{font-size:clamp(32px,7vw,54px);letter-spacing:-1.5px;margin:0 0 8px}.muted{color:#aebbd0;line-height:1.7}.setup{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:30px}.panel{padding:26px;background:linear-gradient(145deg,#ffffff0d,#ffffff06);border:1px solid #ffffff20;border-radius:22px;box-shadow:inset 0 1px #ffffff10}.panel h2{margin:0 0 15px;font-size:23px}select,input,button{min-height:48px;padding:10px 15px;border-radius:13px;font:inherit}select,input{width:100%;margin:8px 0;color:#fff;background:#111c3d;border:1px solid #ffffff30;outline:none}select:focus,input:focus{border-color:var(--cyan);box-shadow:0 0 0 4px #22d3ee1f}button{border:0;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#0f172a;font-weight:900;cursor:pointer;transition:.18s}button:hover{transform:translateY(-2px);filter:brightness(1.08)}.panel button{width:100%;margin-top:8px}.room-line{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:14px 0}.room-code{padding:8px 18px;font-size:clamp(28px,7vw,42px);letter-spacing:8px;color:var(--cyan);background:#02061780;border:1px solid #67e8f944;border-radius:16px;font-weight:950}.copy-btn{min-height:40px;padding:7px 14px;font-size:14px}.info{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.info span{padding:9px 16px;border:1px solid #ffffff1a;border-radius:999px;background:#ffffff0d}.error{color:#fda4af;min-height:25px}#lobby-error{color:#86efac}#game{display:none}.board{display:grid;margin:24px auto;touch-action:manipulation}.gomoku{--cell:clamp(19px,5.25vw,30px);grid-template-columns:repeat(15,var(--cell));grid-template-rows:repeat(15,var(--cell));width:max-content;padding:14px;background:linear-gradient(145deg,#edc886,#c9954e);border:3px solid #7c5526;border-radius:8px;box-shadow:0 16px 35px #0007,inset 0 0 20px #fff3}.gomoku .cell{appearance:none;position:relative;width:var(--cell)!important;height:var(--cell)!important;min-width:0!important;min-height:0!important;max-width:var(--cell)!important;max-height:var(--cell)!important;padding:0!important;border:0;border-radius:0;background:transparent;box-shadow:none}.gomoku .cell::before,.gomoku .cell::after{content:'';position:absolute;background:#65451f;z-index:0;pointer-events:none}.gomoku .cell::before{left:0;right:0;top:50%;height:1px}.gomoku .cell::after{top:0;bottom:0;left:50%;width:1px}.board .cell:hover{transform:none;filter:none}.piece{position:absolute;z-index:2;display:block;left:50%;top:50%;width:84%;height:84%;transform:translate(-50%,-50%);border-radius:50%;box-shadow:1px 2px 5px #0007}.piece.x{background:radial-gradient(circle at 35% 28%,#606060,#050505 68%);border:1px solid #000}.piece.o{background:radial-gradient(circle at 35% 28%,#fff,#d8d8d8 72%);border:1px solid #777}.tictactoe{grid-template-columns:repeat(3,clamp(76px,24vw,112px));gap:10px;width:max-content;background:transparent}.tictactoe .cell{width:clamp(76px,24vw,112px);height:clamp(76px,24vw,112px);padding:0;border:2px solid #ffffff20;border-radius:18px;background:#172554;color:#fff;font-size:clamp(48px,17vw,72px);font-weight:950}.tictactoe .cell.x{color:var(--cyan)}.tictactoe .cell.o{color:#c4b5fd}.tictactoe .cell.selected{outline:4px solid #facc15;transform:scale(.94)}#restart{margin-top:6px;padding-inline:28px}@media(max-width:650px){body{padding:14px}.card{margin:16px auto;padding:22px 12px;border-radius:24px}.setup{grid-template-columns:1fr}.gomoku{padding:9px}.room-code{letter-spacing:5px}.back{font-size:14px}}@media(max-width:390px){.gomoku{--cell:18px}.tictactoe{grid-template-columns:repeat(3,78px)}.tictactoe .cell{width:78px;height:78px}}
</style></head>
<body><a class="back" href="/">← 返回游戏大厅</a><main class="card"><section id="lobby"><h1>局域网联机双人</h1><p class="muted">一台电脑建立房间，另一台电脑输入 6 位房间代码。</p><div class="setup"><div class="panel"><h2>建立房间</h2><select id="game-type"><option value="gomoku">五子棋</option><option value="tictactoe">三子移动井字棋</option></select><button id="create">建立新房间</button></div><div class="panel"><h2>加入房间</h2><input id="join-code" maxlength="6" inputmode="numeric" placeholder="输入 6 位代码"><button id="join">加入房间</button></div></div><p id="lobby-error" class="error"></p></section>
<section id="game"><h1 id="game-title">联机游戏</h1><div class="room-line"><span>房间代码</span><span class="room-code" id="room-code"></span><button class="copy-btn" id="copy-code" type="button">复制代码</button></div><div class="info"><span>你是：<strong id="my-mark"></strong></span><span id="status">等待玩家</span></div><div id="board" class="board"></div><p id="game-error" class="error"></p><button id="restart">重新开始</button></section></main>
<script src="/static/socket.io.min.js"></script><script>
const socket=io({transports:['polling'],upgrade:false}),lobby=document.querySelector('#lobby'),game=document.querySelector('#game'),boardEl=document.querySelector('#board'),statusEl=document.querySelector('#status'),createBtn=document.querySelector('#create'),joinBtn=document.querySelector('#join'),restartBtn=document.querySelector('#restart'),copyBtn=document.querySelector('#copy-code');let me=null,state=null,selected=null;
createBtn.addEventListener('click',()=>socket.emit('create_room',{game:document.querySelector('#game-type').value}));joinBtn.addEventListener('click',()=>socket.emit('join_game',{code:document.querySelector('#join-code').value}));restartBtn.addEventListener('click',()=>socket.emit('restart_online'));copyBtn.addEventListener('click',async()=>{await navigator.clipboard?.writeText(document.querySelector('#room-code').textContent);copyBtn.textContent='已复制';setTimeout(()=>copyBtn.textContent='复制代码',1200)});
socket.on('connect',()=>{document.querySelector('#lobby-error').textContent='实时服务器已连接。';});
socket.on('connect_error',()=>{document.querySelector('#lobby-error').textContent='无法连接实时游戏服务器，请重新启动服务器后刷新页面。'});
socket.on('room_joined',data=>{me=data.player;state=data;lobby.style.display='none';game.style.display='block';document.querySelector('#room-code').textContent=data.code;document.querySelector('#my-mark').textContent=me==='X'?(data.game==='gomoku'?'黑棋':'X'):(data.game==='gomoku'?'白棋':'O');document.querySelector('#game-title').textContent=data.game==='gomoku'?'联机五子棋':'联机三子移动井字棋';render()});
socket.on('state',data=>{state=data;selected=null;render()});socket.on('game_error',d=>{(game.style.display==='block'?document.querySelector('#game-error'):document.querySelector('#lobby-error')).textContent=d.message});socket.on('opponent_left',d=>{statusEl.textContent=d.message});
function render(){if(!state)return;boardEl.innerHTML='';boardEl.className='board '+state.game;if(state.game==='gomoku'){for(let r=0;r<15;r++)for(let c=0;c<15;c++)addCell(state.board[r][c],()=>moveGomoku(r,c))}else state.board.forEach((v,i)=>addCell(v,()=>moveTtt(i),i));if(state.winner)statusEl.textContent=state.winner===me?'🎉 你赢了！':'对方获胜';else if(!state.started)statusEl.textContent='等待另一位玩家加入…';else statusEl.textContent=state.turn===me?'轮到你了':'等待对方落子…'}
function addCell(value,click,index){const b=document.createElement('button');b.className='cell '+(state.game==='tictactoe'&&value?value.toLowerCase():'')+(index===selected?' selected':'');if(state.game==='tictactoe')b.textContent=value;else if(value){const piece=document.createElement('span');piece.className='piece '+value.toLowerCase();b.appendChild(piece)}b.onclick=click;boardEl.appendChild(b)}
function moveGomoku(row,col){if(state.started&&state.turn===me&&!state.winner)socket.emit('make_move',{row,col})}
function moveTtt(i){if(!state.started||state.turn!==me||state.winner)return;if(state.placed[me]<3){socket.emit('make_move',{to:i,from:null});return}if(selected===null){if(state.board[i]!==me){document.querySelector('#game-error').textContent='请先选择自己的一颗棋。';return}selected=i;render();return}if(state.board[i]===me){selected=i;render();return}socket.emit('make_move',{from:selected,to:i})}
</script></body></html>
