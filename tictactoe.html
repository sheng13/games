<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>井字棋</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#f8fafc;background:radial-gradient(circle at 15% 15%,#7c3aed55,transparent 34%),radial-gradient(circle at 85% 80%,#0891b255,transparent 32%),#070b18}.back{position:fixed;top:16px;left:16px;padding:10px 16px;color:#fff;background:#24324a;border-radius:999px;text-decoration:none;font-weight:700}.card{width:min(100%,470px);padding:34px;text-align:center;background:#0f172ad9;border:1px solid #ffffff25;border-radius:28px;box-shadow:0 24px 70px #0007}h1{font-size:42px;margin:0 0 8px}.intro{color:#aebbd0;margin:0 0 14px}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.controls select{padding:9px 12px;border-radius:10px;background:#172554;color:#fff;border:1px solid #ffffff33}#status{min-height:35px;font-size:20px;font-weight:800;color:#67e8f9}.board{width:min(330px,82vw);aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px auto}.cell{padding:0;background:#172554;border:2px solid #ffffff20;border-radius:18px;color:#fff;font-size:clamp(48px,16vw,76px);font-weight:900;cursor:pointer;transition:.15s}.cell:hover:empty{background:#1e3a8a;transform:scale(1.03)}.cell.x{color:#67e8f9}.cell.o{color:#c4b5fd}.cell.selected{outline:4px solid #facc15;transform:scale(.92)}.cell.win{background:#166534;box-shadow:0 0 22px #4ade8066}#restart{margin-top:12px;padding:13px 26px;border:0;border-radius:999px;background:linear-gradient(135deg,#6ee7ff,#a78bfa);color:#0f172a;font-size:16px;font-weight:900;cursor:pointer}@media(max-width:600px){.back{position:static;display:inline-block;margin-bottom:18px}body{display:block;text-align:center}.card{margin:auto}}
</style></head><body><a class="back" href="/">← 返回游戏大厅</a><main class="card"><h1>井字棋</h1><p class="intro">你和电脑各有 3 颗棋。放满后可移动自己的棋，率先连成一线获胜！</p><div class="controls"><label>模式 <select id="mode"><option value="ai">人机对战</option><option value="local">本地双人</option></select></label><label id="difficulty-wrap">难度 <select id="difficulty"><option value="easy">简单</option><option value="normal" selected>普通</option><option value="hard">困难</option></select></label></div><div id="status" role="status">轮到你了</div><div class="board" id="board" aria-label="井字棋棋盘"></div><button id="restart">重新开始</button></main>
<script>
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],board=document.querySelector('#board'),statusEl=document.querySelector('#status'),modeEl=document.querySelector('#mode'),difficultyEl=document.querySelector('#difficulty');
let state,placed,selected,over,thinking,current;
const winning=(b,m)=>wins.find(line=>line.every(i=>b[i]===m));
const empty=b=>b.map((v,i)=>v?'':i).filter(v=>v!=='');
function moves(b,counts,mark){const spaces=empty(b);if(counts[mark]<3)return spaces.map(to=>({from:null,to}));return b.map((v,i)=>v===mark?i:'').filter(v=>v!=='').flatMap(from=>spaces.map(to=>({from,to})))}
function apply(b,counts,m,mark){const nb=[...b],nc={...counts};if(m.from!==null)nb[m.from]='';else nc[mark]++;nb[m.to]=mark;return [nb,nc]}
function finish(mark){const line=winning(state,mark);if(!line)return false;over=true;line.forEach(i=>board.children[i].classList.add('win'));statusEl.textContent=modeEl.value==='local'?`🎉 ${mark} 获胜！`:(mark==='X'?'🎉 你赢了！':'电脑赢了，再试一次！');return true}
function render(){[...board.children].forEach((c,i)=>{c.textContent=state[i];c.className='cell '+(state[i]?state[i].toLowerCase():'')+(i===selected?' selected':'')})}
function prompt(){if(over)return;const placing=placed[current]<3;statusEl.textContent=modeEl.value==='local'?`轮到 ${current}${placing?' 放置棋子':'：先选择棋子再移动'}`:(placing?'轮到你放置 X':'请选择一颗 X 移动')}
function humanClick(i){if(over||thinking)return;const mark=modeEl.value==='local'?current:'X';if(placed[mark]<3){if(state[i])return;state[i]=mark;placed[mark]++;render();if(finish(mark))return;next(mark);return}if(selected===null){if(state[i]!==mark){statusEl.textContent=`请先选择一颗自己的 ${mark}`;return}selected=i;render();statusEl.textContent='现在选择一个空格';return}if(state[i]===mark){selected=i;render();return}if(state[i]){statusEl.textContent='目标格必须是空的';return}state[i]=mark;state[selected]='';selected=null;render();if(finish(mark))return;next(mark)}
function next(mark){current=mark==='X'?'O':'X';if(modeEl.value==='ai'&&current==='O')computerTurn();else prompt()}
function immediate(mark){return moves(state,placed,mark).find(m=>winning(apply(state,placed,m,mark)[0],mark))}
function score(b){if(winning(b,'O'))return 10000;if(winning(b,'X'))return -10000;let n=0;for(const line of wins){const vals=line.map(i=>b[i]);const os=vals.filter(v=>v==='O').length,xs=vals.filter(v=>v==='X').length;if(!xs)n+=os*os*4;if(!os)n-=xs*xs*5}if(b[4]==='O')n+=3;if(b[4]==='X')n-=3;return n}
function minimax(b,counts,turn,depth,alpha,beta){const base=score(b);if(Math.abs(base)>=10000||depth===0)return base;const list=moves(b,counts,turn);if(turn==='O'){let best=-Infinity;for(const m of list){const [nb,nc]=apply(b,counts,m,'O');best=Math.max(best,minimax(nb,nc,'X',depth-1,alpha,beta));alpha=Math.max(alpha,best);if(beta<=alpha)break}return best}else{let best=Infinity;for(const m of list){const [nb,nc]=apply(b,counts,m,'X');best=Math.min(best,minimax(nb,nc,'O',depth-1,alpha,beta));beta=Math.min(beta,best);if(beta<=alpha)break}return best}}
function aiChoice(){const list=moves(state,placed,'O'),level=difficultyEl.value;if(level==='easy')return list[Math.floor(Math.random()*list.length)];const winNow=immediate('O');if(winNow)return winNow;const block=immediate('X');if(level==='normal'){if(block){const same=list.find(m=>m.to===block.to);if(same)return same}const preferred=list.filter(m=>m.to===4||[0,2,6,8].includes(m.to));const pool=preferred.length?preferred:list;return pool[Math.floor(Math.random()*pool.length)]}let best=list[0],value=-Infinity;for(const m of list){const [nb,nc]=apply(state,placed,m,'O'),v=minimax(nb,nc,'X',6,-Infinity,Infinity);if(v>value){value=v;best=m}}return best}
function computerTurn(){thinking=true;statusEl.textContent='电脑思考中…';setTimeout(()=>{const m=aiChoice();[state,placed]=apply(state,placed,m,'O');render();thinking=false;if(!finish('O')){current='X';prompt()}},350)}
function reset(){state=Array(9).fill('');placed={X:0,O:0};selected=null;over=false;thinking=false;current='X';board.innerHTML='';for(let i=0;i<9;i++){const b=document.createElement('button');b.className='cell';b.setAttribute('aria-label',`第 ${i+1} 格`);b.onclick=()=>humanClick(i);board.appendChild(b)}document.querySelector('#difficulty-wrap').style.display=modeEl.value==='ai'?'inline':'none';prompt()}
document.querySelector('#restart').onclick=reset;modeEl.onchange=reset;difficultyEl.onchange=reset;reset();
</script></body></html>
