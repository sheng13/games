<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>西洋棋</title>
<style>
:root{--page:#070b18;--panel:#0f172ae8;--text:#f8fafc;--muted:#aebbd0;--line:#ffffff25;--cyan:#67e8f9;--purple:#a78bfa;--light:#dbeafe;--dark:#475569}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px 16px 32px;font-family:system-ui,"Microsoft YaHei",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 15%,#3730a3,transparent 34%),radial-gradient(circle at 85% 80%,#155e75,transparent 32%),var(--page);display:flex;justify-content:center}button{font:inherit}.page{width:min(1040px,100%)}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}.back{color:#dbeafe;text-decoration:none;padding:10px 15px;border:1px solid var(--line);border-radius:999px;background:#0f172aa8}.back:hover{border-color:var(--cyan)}h1{font-size:clamp(25px,4vw,38px);margin:0}.sub{color:var(--muted);margin:3px 0 0;text-align:right}.shell{display:grid;grid-template-columns:minmax(300px,650px) minmax(245px,1fr);gap:22px;align-items:start}.board-card,.side{background:var(--panel);border:1px solid var(--line);border-radius:26px;box-shadow:0 22px 60px #0007}.board-card{padding:16px}.players{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}.player{display:flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid transparent;border-radius:12px;color:var(--muted)}.player.active{background:#67e8f912;border-color:#67e8f955;color:var(--text)}.dot{width:13px;height:13px;border-radius:50%;background:#f8fafc;box-shadow:0 0 0 2px #64748b}.black .dot{background:#111827}.turn{font-weight:800;color:var(--cyan);text-align:center}.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border:2px solid #94a3b8;border-radius:8px;overflow:hidden;box-shadow:0 8px 30px #0008}.square{position:relative;border:0;padding:0;display:grid;place-items:center;cursor:pointer;font-family:"DejaVu Sans",serif;font-size:clamp(31px,7vw,66px);line-height:1;user-select:none}.square.light{background:#dbeafe}.square.dark{background:#52647c}.square:hover{filter:brightness(1.08)}.piece.white-piece{color:#fff;text-shadow:0 2px 2px #000,0 0 1px #000}.piece.black-piece{color:#111827;text-shadow:0 1px 1px #fff8}.square.selected{box-shadow:inset 0 0 0 5px #67e8f9;background:#0e7490}.square.last{box-shadow:inset 0 0 0 999px #facc1533}.square.check{box-shadow:inset 0 0 0 999px #fb718566}.hint{position:absolute;width:22%;height:22%;border-radius:50%;background:#0f172a8f;pointer-events:none}.hint.capture{width:75%;height:75%;background:transparent;border:6px solid #fb7185aa}.coord{position:absolute;left:3px;top:2px;font:700 10px system-ui;color:#0f172a99}.side{padding:22px}.status{padding:15px;border-radius:15px;background:#ffffff0b;border:1px solid var(--line);font-weight:800;text-align:center;line-height:1.45}.status.warning{color:#fecdd3;border-color:#fb718566;background:#88133730}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:15px 0}.action{padding:11px;border-radius:12px;border:1px solid var(--line);background:#ffffff0a;color:var(--text);font-weight:700;cursor:pointer}.action:hover{border-color:var(--cyan)}.side h2{font-size:16px;margin:18px 0 8px}.field{display:grid;gap:7px;margin:14px 0}.field label{color:var(--muted);font-size:14px}.field select{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#111c33;color:var(--text);font:inherit}.captured{min-height:30px;padding:8px 10px;border-radius:10px;background:#ffffff08;font:24px "DejaVu Sans",serif;letter-spacing:2px}.history{height:220px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#02061755;padding:8px}.move-row{display:grid;grid-template-columns:32px 1fr 1fr;padding:5px 6px;border-radius:6px;color:#cbd5e1;font-size:14px}.move-row:nth-child(odd){background:#ffffff08}.rules{color:var(--muted);font-size:13px;line-height:1.6;margin:14px 0 0}.promotion{position:fixed;inset:0;background:#020617cc;display:grid;place-items:center;padding:20px;z-index:10}.promotion[hidden]{display:none}.promo-card{width:min(390px,100%);padding:25px;border:1px solid var(--line);border-radius:22px;background:#0f172a;text-align:center;box-shadow:0 25px 80px #000}.promo-card h2{margin:0 0 16px}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.promo{aspect-ratio:1;border:1px solid var(--line);border-radius:13px;background:#ffffff0a;color:#fff;font:48px "DejaVu Sans",serif;cursor:pointer}.promo:hover{border-color:var(--cyan);background:#164e63}@media(max-width:780px){body{padding:13px 10px 28px}.sub{display:none}.shell{grid-template-columns:1fr}.board-card{padding:10px;border-radius:18px}.side{padding:18px}.history{height:150px}.square{font-size:clamp(28px,11vw,61px)}}
</style></head><body><main class="page"><header class="top"><a class="back" href="/">← 游戏大厅</a><div><h1>♞ 西洋棋</h1><p class="sub">三档 AI · 本地双人 · 完整规则</p></div></header><section class="shell"><div class="board-card"><div class="players"><div class="player black" id="blackPlayer"><span class="dot"></span><strong>黑方</strong></div><div class="turn" id="turn">白方回合</div><div class="player active" id="whitePlayer"><span class="dot"></span><strong>白方</strong></div></div><div class="board" id="board" role="grid" aria-label="西洋棋棋盘"></div></div><aside class="side"><div class="status" id="status">白方先行，请选择棋子</div><div class="field"><label for="mode">对战模式</label><select id="mode"><option value="normal" selected>电脑对战 · 普通</option><option value="easy">电脑对战 · 简单</option><option value="hard">电脑对战 · 困难</option><option value="local">本地双人</option></select></div><div class="actions"><button class="action" id="undo">悔棋</button><button class="action" id="restart">重新开局</button></div><h2>已吃棋子</h2><div class="captured" id="captured">—</div><h2>棋谱</h2><div class="history" id="history"><div class="move-row"><span>—</span><span>等待开局</span></div></div><p class="rules">点击棋子后会显示合法落点。支持将军、将死、逼和、王车易位、吃过路兵与兵升变。</p></aside></section></main><div class="promotion" id="promotion" hidden><div class="promo-card"><h2>选择升变棋子</h2><div class="choices" id="choices"></div></div></div>
<script>
const icons={w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}},names={k:'王',q:'后',r:'车',b:'象',n:'马',p:'兵'},files='abcdefgh';let board,turn,selected,legal,lastMove,enPassant,history,snapshots,captured,gameOver,promotionMove,aiThinking=false;
const boardEl=document.querySelector('#board'),statusEl=document.querySelector('#status'),turnEl=document.querySelector('#turn'),historyEl=document.querySelector('#history'),capturedEl=document.querySelector('#captured'),promotionEl=document.querySelector('#promotion');const modeEl=document.querySelector('#mode');
function piece(t,c){return{t,c,moved:false}}
function initial(){return[[piece('r','b'),piece('n','b'),piece('b','b'),piece('q','b'),piece('k','b'),piece('b','b'),piece('n','b'),piece('r','b')],Array.from({length:8},()=>piece('p','b')),...Array.from({length:4},()=>Array(8).fill(null)),Array.from({length:8},()=>piece('p','w')),[piece('r','w'),piece('n','w'),piece('b','w'),piece('q','w'),piece('k','w'),piece('b','w'),piece('n','w'),piece('r','w')]]}
function reset(){board=initial();turn='w';selected=null;legal=[];lastMove=null;enPassant=null;history=[];snapshots=[];captured=[];gameOver=false;promotionMove=null;aiThinking=false;promotionEl.hidden=true;setStatus('白方先行，请选择棋子');render()}
function clone(b){return b.map(row=>row.map(p=>p?{...p}:null))}function inside(r,c){return r>=0&&r<8&&c>=0&&c<8}function other(c){return c==='w'?'b':'w'}
function pseudo(b,r,c,attacks=false,ep=enPassant){const p=b[r][c];if(!p)return[];let out=[],add=(rr,cc)=>{if(inside(rr,cc)&&(!b[rr][cc]||b[rr][cc].c!==p.c))out.push({r:rr,c:cc})},slide=(dr,dc)=>{let rr=r+dr,cc=c+dc;while(inside(rr,cc)){if(!b[rr][cc])out.push({r:rr,c:cc});else{if(b[rr][cc].c!==p.c)out.push({r:rr,c:cc});break}rr+=dr;cc+=dc}};
if(p.t==='p'){let d=p.c==='w'?-1:1;if(attacks){for(const dc of[-1,1])if(inside(r+d,c+dc))out.push({r:r+d,c:c+dc})}else{if(inside(r+d,c)&&!b[r+d][c]){out.push({r:r+d,c});let home=p.c==='w'?6:1;if(r===home&&!b[r+2*d][c])out.push({r:r+2*d,c})}for(const dc of[-1,1]){let rr=r+d,cc=c+dc;if(inside(rr,cc)&&b[rr][cc]&&b[rr][cc].c!==p.c)out.push({r:rr,c:cc});else if(ep&&ep.r===rr&&ep.c===cc&&ep.color!==p.c)out.push({r:rr,c:cc,enPassant:true})}}}
if(p.t==='n')for(const[dr,dc]of[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]])add(r+dr,c+dc);
if(p.t==='b'||p.t==='q')for(const d of[[1,1],[1,-1],[-1,1],[-1,-1]])slide(...d);if(p.t==='r'||p.t==='q')for(const d of[[1,0],[-1,0],[0,1],[0,-1]])slide(...d);
if(p.t==='k'){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)add(r+dr,c+dc);if(!attacks&&!p.moved&&!isAttacked(b,r,c,other(p.c))){for(const side of[-1,1]){let rookC=side<0?0:7,rook=b[r][rookC],dest=c+2*side,clear=true;for(let x=c+side;x!==rookC;x+=side)if(b[r][x])clear=false;if(rook&&rook.t==='r'&&rook.c===p.c&&!rook.moved&&clear&&!isAttacked(b,r,c+side,other(p.c))&&!isAttacked(b,r,dest,other(p.c)))out.push({r,c:dest,castle:true})}}}return out}
function isAttacked(b,r,c,by){for(let rr=0;rr<8;rr++)for(let cc=0;cc<8;cc++){let p=b[rr][cc];if(p&&p.c===by&&pseudo(b,rr,cc,true,null).some(m=>m.r===r&&m.c===c))return true}return false}
function kingPos(b,color){for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(b[r][c]?.t==='k'&&b[r][c].c===color)return{r,c}}
function inCheck(b,color){let k=kingPos(b,color);return k&&isAttacked(b,k.r,k.c,other(color))}
function simulate(b,fr,fc,m){let n=clone(b),p=n[fr][fc];n[fr][fc]=null;if(m.enPassant)n[fr][m.c]=null;n[m.r][m.c]=p;if(m.castle){let rookFrom=m.c>fc?7:0,rookTo=m.c>fc?m.c-1:m.c+1;n[fr][rookTo]=n[fr][rookFrom];n[fr][rookFrom]=null}return n}
function movesFor(r,c){let p=board[r][c];if(!p)return[];return pseudo(board,r,c).filter(m=>!inCheck(simulate(board,r,c,m),p.c))}
function allMoves(color){return allEntries(color).map(e=>e.move)}function allEntries(color){let out=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(board[r][c]?.c===color)for(const move of movesFor(r,c))out.push({fr:r,fc:c,move});return out}
function clickSquare(r,c){if(gameOver||promotionMove||aiThinking||(modeEl.value!=='local'&&turn==='b'))return;let p=board[r][c];if(selected){let move=legal.find(m=>m.r===r&&m.c===c);if(move)return makeMove(selected.r,selected.c,move);if(p&&p.c===turn){selected={r,c};legal=movesFor(r,c)}else{selected=null;legal=[]}}else if(p&&p.c===turn){selected={r,c};legal=movesFor(r,c)}render()}
function makeMove(fr,fc,m){snapshots.push({board:clone(board),turn,lastMove:structuredClone(lastMove),enPassant:structuredClone(enPassant),history:[...history],captured:[...captured],gameOver});let p=board[fr][fc],taken=m.enPassant?board[fr][m.c]:board[m.r][m.c],notation=names[p.t]+files[fc]+(8-fr)+'–'+files[m.c]+(8-m.r);if(taken)captured.push(taken);board[fr][fc]=null;if(m.enPassant)board[fr][m.c]=null;board[m.r][m.c]=p;if(m.castle){let rf=m.c>fc?7:0,rt=m.c>fc?m.c-1:m.c+1;board[fr][rt]=board[fr][rf];board[fr][rf]=null;board[fr][rt].moved=true;notation=m.c>fc?'O-O':'O-O-O'}p.moved=true;enPassant=p.t==='p'&&Math.abs(m.r-fr)===2?{r:(fr+m.r)/2,c:fc,color:p.c}:null;lastMove={fr,fc,tr:m.r,tc:m.c};history.push(notation);selected=null;legal=[];if(p.t==='p'&&(m.r===0||m.r===7)){if(modeEl.value!=='local'&&p.c==='b'){p.t='q';history[history.length-1]+='=后'}else{promotionMove={p,notationIndex:history.length-1};showPromotion(p.c);render();return}}finishTurn()}
function showPromotion(color){let choices=document.querySelector('#choices');choices.innerHTML='';for(const t of['q','r','b','n']){let b=document.createElement('button');b.className='promo';b.textContent=icons[color][t];b.title=names[t];b.onclick=()=>{promotionMove.p.t=t;history[promotionMove.notationIndex]+='='+names[t];promotionMove=null;promotionEl.hidden=true;finishTurn()};choices.appendChild(b)}promotionEl.hidden=false}
function finishTurn(){turn=other(turn);let checked=inCheck(board,turn),moves=allMoves(turn);if(!moves.length){gameOver=true;if(checked)setStatus(`${turn==='w'?'白':'黑'}方被将死，${turn==='w'?'黑':'白'}方获胜！`,true);else setStatus('无合法走法，本局和棋')}else if(checked)setStatus(`${turn==='w'?'白':'黑'}方被将军！`,true);else setStatus(`${turn==='w'?'白':'黑'}方回合`);render();if(!gameOver&&turn==='b'&&modeEl.value!=='local'){aiThinking=true;setStatus('电脑正在思考…');setTimeout(aiMove,350)}}
function evaluate(b){const value={p:100,n:320,b:330,r:500,q:900,k:20000};let score=0;for(const row of b)for(const p of row)if(p)score+=(p.c==='b'?1:-1)*value[p.t];return score}
function minimax(position,depth,color,alpha,beta){if(depth===0)return evaluate(position);const saved=board;board=position;const entries=allEntries(color);if(!entries.length){const result=inCheck(board,color)?(color==='b'?-99999:99999):0;board=saved;return result}let best=color==='b'?-Infinity:Infinity;for(const e of entries){const next=simulate(position,e.fr,e.fc,e.move),score=minimax(next,depth-1,other(color),alpha,beta);if(color==='b'){best=Math.max(best,score);alpha=Math.max(alpha,best)}else{best=Math.min(best,score);beta=Math.min(beta,best)}if(beta<=alpha)break}board=saved;return best}
function aiMove(){if(gameOver||turn!=='b'||modeEl.value==='local'){aiThinking=false;return}const entries=allEntries('b');if(!entries.length){aiThinking=false;return}let choice;if(modeEl.value==='easy')choice=entries[Math.floor(Math.random()*entries.length)];else{const depth=modeEl.value==='hard'?2:1;let best=-Infinity,candidates=[];for(const e of entries){const next=simulate(board,e.fr,e.fc,e.move);let score=minimax(next,depth-1,'w',-Infinity,Infinity)+Math.random()*.2;if(score>best+.01){best=score;candidates=[e]}else if(Math.abs(score-best)<.01)candidates.push(e)}choice=candidates[Math.floor(Math.random()*candidates.length)]}aiThinking=false;makeMove(choice.fr,choice.fc,choice.move)}
function setStatus(text,warn=false){statusEl.textContent=text;statusEl.classList.toggle('warning',warn)}
function render(){boardEl.innerHTML='';let checkedKing=inCheck(board,turn)?kingPos(board,turn):null;for(let r=0;r<8;r++)for(let c=0;c<8;c++){let s=document.createElement('button'),p=board[r][c],hint=legal.find(m=>m.r===r&&m.c===c);s.className=`square ${(r+c)%2?'dark':'light'}`;s.setAttribute('aria-label',p?`${p.c==='w'?'白':'黑'}${names[p.t]} ${files[c]}${8-r}`:`${files[c]}${8-r}`);if(selected?.r===r&&selected.c===c)s.classList.add('selected');if(lastMove&&(lastMove.fr===r&&lastMove.fc===c||lastMove.tr===r&&lastMove.tc===c))s.classList.add('last');if(checkedKing?.r===r&&checkedKing.c===c)s.classList.add('check');if(p){let span=document.createElement('span');span.className=`piece ${p.c==='w'?'white-piece':'black-piece'}`;span.textContent=icons[p.c][p.t];s.appendChild(span)}if(hint){let h=document.createElement('span');h.className='hint'+(p?' capture':'');s.appendChild(h)}if(c===0){let co=document.createElement('span');co.className='coord';co.textContent=8-r;s.appendChild(co)}s.onclick=()=>clickSquare(r,c);boardEl.appendChild(s)}turnEl.textContent=(turn==='w'?'白方':'黑方')+'回合';document.querySelector('#whitePlayer').classList.toggle('active',turn==='w');document.querySelector('#blackPlayer').classList.toggle('active',turn==='b');capturedEl.textContent=captured.length?captured.map(p=>icons[p.c][p.t]).join(''):'—';historyEl.innerHTML=history.length?'':'';if(!history.length)historyEl.innerHTML='<div class="move-row"><span>—</span><span>等待开局</span></div>';else for(let i=0;i<history.length;i+=2){let row=document.createElement('div');row.className='move-row';row.innerHTML=`<span>${i/2+1}.</span><span>${history[i]||''}</span><span>${history[i+1]||''}</span>`;historyEl.appendChild(row)}historyEl.scrollTop=historyEl.scrollHeight}
document.querySelector('#restart').onclick=()=>{if(history.length&&!confirm('确定要重新开始这局棋吗？'))return;reset()};function restoreOne(){let s=snapshots.pop();if(!s)return false;board=s.board;turn=s.turn;lastMove=s.lastMove;enPassant=s.enPassant;history=s.history;captured=s.captured;gameOver=s.gameOver;return true}document.querySelector('#undo').onclick=()=>{if(!restoreOne())return;if(modeEl.value!=='local'&&turn==='b')restoreOne();aiThinking=false;selected=null;legal=[];promotionMove=null;promotionEl.hidden=true;setStatus(`${turn==='w'?'白':'黑'}方回合`);render()};modeEl.onchange=()=>{if(history.length&&!confirm('切换模式会重新开局，确定继续吗？')){modeEl.value=modeEl.dataset.previous||'normal';return}modeEl.dataset.previous=modeEl.value;reset()};modeEl.dataset.previous=modeEl.value;reset();
</script></body></html>
