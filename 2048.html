<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>霓虹 2048</title>
<style>
:root{--page:#070b18;--panel:#0f172ae8;--text:#f8fafc;--muted:#aebbd0;--line:#ffffff25;--cyan:#67e8f9;--purple:#a78bfa}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px 18px 34px;font-family:system-ui,"Microsoft YaHei",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 15%,#3730a3,transparent 34%),radial-gradient(circle at 85% 80%,#155e75,transparent 32%),var(--page);display:flex;justify-content:center;overscroll-behavior:none}button{font:inherit}.page{width:min(900px,100%)}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.back{color:#dbeafe;text-decoration:none;padding:10px 15px;border:1px solid var(--line);border-radius:999px;background:#0f172aa8}.back:hover{border-color:var(--cyan)}h1{font-size:clamp(27px,5vw,42px);margin:0}.subtitle{color:var(--muted);margin:3px 0 0;text-align:right}.shell{display:grid;grid-template-columns:minmax(300px,560px) minmax(220px,1fr);gap:22px;align-items:start}.game-card,.side{background:var(--panel);border:1px solid var(--line);border-radius:26px;box-shadow:0 22px 60px #0007}.game-card{padding:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px}.stat{padding:9px;text-align:center;background:#ffffff0b;border:1px solid var(--line);border-radius:14px}.stat span{display:block;font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:24px;font-variant-numeric:tabular-nums}.stage{position:relative;aspect-ratio:1;padding:10px;border-radius:18px;background:#02061788;border:1px solid #67e8f944;touch-action:none}.grid{height:100%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px}.cell{position:relative;display:grid;place-items:center;border-radius:13px;background:#ffffff0a;border:1px solid #ffffff0d}.tile{position:absolute;inset:0;display:grid;place-items:center;border-radius:13px;font-size:clamp(25px,7vw,50px);font-weight:950;letter-spacing:-2px;color:#fff;text-shadow:0 2px 4px #0007;box-shadow:inset 0 1px #fff4,0 5px 15px #0005;animation:appear .18s ease}.tile.merged{animation:merge .22s ease}.v2{background:linear-gradient(135deg,#334155,#475569)}.v4{background:linear-gradient(135deg,#155e75,#0891b2)}.v8{background:linear-gradient(135deg,#0f766e,#14b8a6)}.v16{background:linear-gradient(135deg,#047857,#34d399)}.v32{background:linear-gradient(135deg,#4d7c0f,#84cc16)}.v64{background:linear-gradient(135deg,#ca8a04,#facc15);color:#172033;text-shadow:none}.v128{background:linear-gradient(135deg,#ea580c,#fb923c)}.v256{background:linear-gradient(135deg,#dc2626,#fb7185)}.v512{background:linear-gradient(135deg,#be185d,#f472b6)}.v1024{background:linear-gradient(135deg,#7e22ce,#c084fc);font-size:clamp(20px,6vw,41px)}.v2048{background:linear-gradient(135deg,#4f46e5,#67e8f9);font-size:clamp(20px,6vw,41px);box-shadow:0 0 25px #67e8f988,inset 0 1px #fff8}.vbig{background:linear-gradient(135deg,#312e81,#a78bfa);font-size:clamp(17px,5vw,34px)}@keyframes appear{from{transform:scale(.45);opacity:.2}}@keyframes merge{50%{transform:scale(1.16);filter:brightness(1.25)}}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:20px;border-radius:18px;background:#020617d9;backdrop-filter:blur(5px);text-align:center;z-index:3}.overlay[hidden]{display:none}.overlay h2{font-size:32px;margin:0 0 8px}.overlay p{margin:0 0 18px;color:#cbd5e1;line-height:1.6}.primary{border:0;border-radius:999px;padding:12px 26px;color:#07111f;background:linear-gradient(135deg,var(--cyan),var(--purple));font-weight:900;cursor:pointer}.side{padding:22px}.side h2{font-size:19px;margin:0 0 13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.secondary{padding:11px;border-radius:12px;border:1px solid var(--line);background:#ffffff0a;color:var(--text);font-weight:750;cursor:pointer}.secondary:hover{border-color:var(--cyan)}.secondary:disabled{opacity:.4;cursor:not-allowed}.tip{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;line-height:1.75}.keys{margin-top:9px}.key{display:inline-block;padding:3px 8px;margin:2px;border:1px solid #ffffff38;border-bottom-width:3px;border-radius:6px}.goal{display:flex;align-items:center;gap:10px;margin:17px 0;padding:12px;border-radius:13px;background:#67e8f90c;border:1px solid #67e8f92b}.goal-icon{font-size:28px}.goal div{font-size:13px;color:var(--muted)}.goal strong{display:block;color:var(--text);font-size:15px}.live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}@media(max-width:720px){body{padding:14px 11px 28px}.subtitle{display:none}.shell{grid-template-columns:1fr}.game-card{padding:10px;border-radius:19px}.stage,.overlay{border-radius:15px}.grid{gap:7px}.cell,.tile{border-radius:9px}.side{padding:18px}.tip .keys{display:none}}@media(max-width:380px){.actions{grid-template-columns:1fr}.stats{gap:5px}.stat strong{font-size:20px}.stage{padding:7px}.grid{gap:6px}}
</style></head><body><main class="page"><header class="top"><a class="back" href="/">← 游戏大厅</a><div><h1>🔢 霓虹 2048</h1><p class="subtitle">滑动方块，合成更大的数字</p></div></header><section class="shell"><div class="game-card"><div class="stats"><div class="stat"><span>分数</span><strong id="score">0</strong></div><div class="stat"><span>最高分</span><strong id="best">0</strong></div><div class="stat"><span>步数</span><strong id="moves">0</strong></div></div><div class="stage" id="stage"><div class="grid" id="grid" role="grid" aria-label="2048 游戏棋盘"></div><div class="overlay" id="overlay" hidden><div><h2 id="overlayTitle"></h2><p id="overlayText"></p><button class="primary" id="overlayBtn"></button></div></div></div></div><aside class="side"><h2>游戏控制</h2><div class="actions"><button class="secondary" id="undo" disabled>撤销一步</button><button class="secondary" id="restart">重新开始</button></div><div class="goal"><span class="goal-icon">✨</span><div><strong>目标：合成 2048</strong>达到目标后仍可继续挑战更高数字。</div></div><div class="tip">每次滑动，所有方块会向同一方向移动；两个相同数字相遇时会合并一次。<div class="keys"><span class="key">方向键</span><span class="key">W A S D</span><span class="key">手机滑动</span></div></div></aside></section><p class="live" id="announcement" aria-live="polite"></p></main>
<script>
const gridEl=document.querySelector('#grid'),stage=document.querySelector('#stage'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),movesEl=document.querySelector('#moves'),undoBtn=document.querySelector('#undo'),restartBtn=document.querySelector('#restart'),overlay=document.querySelector('#overlay'),overlayTitle=document.querySelector('#overlayTitle'),overlayText=document.querySelector('#overlayText'),overlayBtn=document.querySelector('#overlayBtn'),announcement=document.querySelector('#announcement');let board,score,moves,best=Number(localStorage.getItem('neon2048Best')||0),previous=null,mergedCells=new Set(),wonShown=false,touchStart=null;bestEl.textContent=best;
function emptyBoard(){return Array.from({length:4},()=>Array(4).fill(0))}function copyBoard(value){return value.map(row=>[...row])}function emptyCells(){const cells=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!board[r][c])cells.push([r,c]);return cells}
function addTile(){const cells=emptyCells();if(!cells.length)return;const[r,c]=cells[Math.floor(Math.random()*cells.length)];board[r][c]=Math.random()<.9?2:4}
function reset(){board=emptyBoard();score=0;moves=0;previous=null;mergedCells.clear();wonShown=false;overlay.hidden=true;addTile();addTile();update();undoBtn.disabled=true;announcement.textContent='新游戏开始'}
function slideLine(values){const compact=values.filter(Boolean),result=[],merged=[];let gain=0;for(let i=0;i<compact.length;i++){if(compact[i]===compact[i+1]){const value=compact[i]*2;result.push(value);merged.push(result.length-1);gain+=value;i++}else result.push(compact[i])}while(result.length<4)result.push(0);return{result,gain,merged}}
function coordinateLines(direction){const lines=[];for(let i=0;i<4;i++){const line=[];for(let j=0;j<4;j++){if(direction==='left')line.push([i,j]);if(direction==='right')line.push([i,3-j]);if(direction==='up')line.push([j,i]);if(direction==='down')line.push([3-j,i])}lines.push(line)}return lines}
function move(direction){if(!overlay.hidden)return;const before=JSON.stringify(board),old={board:copyBoard(board),score,moves,wonShown};mergedCells.clear();let gain=0;for(const coords of coordinateLines(direction)){const {result,gain:lineGain,merged}=slideLine(coords.map(([r,c])=>board[r][c]));gain+=lineGain;coords.forEach(([r,c],i)=>{board[r][c]=result[i];if(merged.includes(i))mergedCells.add(`${r}-${c}`)})}if(JSON.stringify(board)===before)return;previous=old;score+=gain;moves++;if(score>best){best=score;localStorage.setItem('neon2048Best',String(best))}addTile();update();undoBtn.disabled=false;announcement.textContent=gain?`合并得分 ${gain}，总分 ${score}`:`已向${{left:'左',right:'右',up:'上',down:'下'}[direction]}移动`;if(!wonShown&&board.some(row=>row.includes(2048))){wonShown=true;showOverlay('太棒了！','你成功合成了 2048，可以继续挑战更高数字。','继续挑战','continue')}else if(!canMove())showOverlay('没有空间了','本局获得 '+score+' 分，再试一次突破纪录吧！','再玩一局','restart')}
function canMove(){if(emptyCells().length)return true;for(let r=0;r<4;r++)for(let c=0;c<4;c++){if(r<3&&board[r][c]===board[r+1][c])return true;if(c<3&&board[r][c]===board[r][c+1])return true}return false}
function update(){gridEl.innerHTML='';for(let r=0;r<4;r++)for(let c=0;c<4;c++){const cell=document.createElement('div'),value=board[r][c];cell.className='cell';cell.setAttribute('role','gridcell');cell.setAttribute('aria-label',value?String(value):'空格');if(value){const tile=document.createElement('div');tile.className='tile '+(value>2048?'vbig':'v'+value)+(mergedCells.has(`${r}-${c}`)?' merged':'');tile.textContent=value;cell.appendChild(tile)}gridEl.appendChild(cell)}scoreEl.textContent=score;bestEl.textContent=best;movesEl.textContent=moves}
function undo(){if(!previous)return;board=copyBoard(previous.board);score=previous.score;moves=previous.moves;wonShown=previous.wonShown;previous=null;mergedCells.clear();overlay.hidden=true;undoBtn.disabled=true;update();announcement.textContent='已撤销上一步'}
function showOverlay(title,text,button,action){overlayTitle.textContent=title;overlayText.textContent=text;overlayBtn.textContent=button;overlayBtn.dataset.action=action;overlay.hidden=false}overlayBtn.onclick=()=>{if(overlayBtn.dataset.action==='continue'){overlay.hidden=true;announcement.textContent='继续挑战'}else reset()};
document.addEventListener('keydown',event=>{const map={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down'};if(map[event.key]){event.preventDefault();move(map[event.key])}});stage.addEventListener('pointerdown',event=>{touchStart={x:event.clientX,y:event.clientY};stage.setPointerCapture?.(event.pointerId)});stage.addEventListener('pointerup',event=>{if(!touchStart)return;const dx=event.clientX-touchStart.x,dy=event.clientY-touchStart.y;touchStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});undoBtn.onclick=undo;restartBtn.onclick=()=>{if(moves&&!confirm('确定要重新开始吗？'))return;reset()};reset();
</script></body></html>
